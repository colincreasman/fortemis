# Fortemis dongle (central). The PandaKB dongle's OLED wiring lives in the
# pandakb_dongle shield, and the status screen comes from englmaxi's
# dongle_display.

CONFIG_ZMK_BATTERY_REPORTING=y

# The keymap uses five Bluetooth profiles (BT_SEL 0-4). On a dongle the two
# halves take two of the connection slots, so raise both limits to 5 + 2 to keep
# all five profiles usable when the dongle is on battery and pairing to hosts.
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Maximum radio power. The dongle is normally USB powered, and the extra link
# margin to both halves is worth far more than the current it costs.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Deliberately NO CONFIG_ZMK_SLEEP: deep sleep is only woken by a key press, and
# the dongle has no keys.

# Status screen: show the dongle's own battery and macOS modifier glyphs.
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y
